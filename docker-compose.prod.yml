# ==========================================
# Docker Compose - Modo Produção / Avaliação
# Utiliza a imagem já construída e publicada no Docker Hub
# ==========================================

services:
  app:
    image: murilo751/achados-e-perdidos:latest
    ports:
      - "5000:5000"
    environment:
      DB_NAME: achados_perdidos
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: achados_perdidos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db_data:
