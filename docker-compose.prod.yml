# ==========================================
# Docker Compose - Modo Produção / Avaliação
# Utiliza a imagem já construída e publicada no Docker Hub
# ==========================================

name: achados-e-perdidos-prod

services:
  app:
    image: "murilo751/achados-e-perdidos:${IMAGE_TAG:?Defina_IMAGE_TAG_no_.env.prod_com_SHA_ou_tag_de_release}"
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-5001}:5000"
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db_data:
