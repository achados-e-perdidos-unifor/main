name: CI/CD Pipeline

on:
  push:
    branches: [main, feature/*, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar pip e dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar imports do projeto
        run: |
          python -c "from App import app; print('✅ App importado com sucesso')"

      - name: Gerar artefato ZIP
        run: |
          mkdir -p artifacts
          zip -r artifacts/build-${{ github.run_number }}.zip . -x "*.git*" "__pycache__/*" ".venv/*" "venv/*" "*.pyc" ".pytest_cache/*"

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ github.run_number }}
          path: artifacts/build-${{ github.run_number }}.zip
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependências de linting
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Executar flake8 (sem tolerância a mascaramento de falhas)
        run: |
          flake8 . --count --show-source --statistics

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Executar testes unitários (mocks)
        run: |
          python -m pytest tests/test_ci.py -v --tb=short

      - name: Construir imagem Docker
        run: |
          docker build -t app:${{ github.sha }} .

      - name: Subir ambiente com Docker Compose
        run: |
          docker compose up -d
          sleep 8
          curl -f http://localhost:5000/health || (docker compose logs && exit 1)

      - name: Executar testes de integração (contra banco real)
        env:
          APP_URL: http://localhost:5000
          DB_NAME: achados_perdidos
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python -m pytest tests/test_integration.py -v --tb=short

      - name: Parar Docker Compose
        if: always()
        run: |
          docker compose down -v

      - name: Salvar imagem Docker
        run: |
          docker save app:${{ github.sha }} -o image.tar

      - name: Upload da imagem Docker como artefato
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: test

    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download da imagem Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Carregar imagem Docker
        run: docker load -i image.tar

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag e push da imagem
        run: |
          docker tag app:${{ github.sha }} murilo751/achados-e-perdidos:${{ github.sha }}
          docker tag app:${{ github.sha }} murilo751/achados-e-perdidos:latest
          docker push murilo751/achados-e-perdidos:${{ github.sha }}
          docker push murilo751/achados-e-perdidos:latest
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            docker tag app:${{ github.sha }} murilo751/achados-e-perdidos:${VERSION}
            docker push murilo751/achados-e-perdidos:${VERSION}
          fi
