name: CI/CD Pipeline

on:
  push:
    branches: [ main, feature/*, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

defaults:
  run:
    shell: powershell

jobs:
  build:
    runs-on: windows_local

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar pip e dependências
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "Failed to update pip" }
          pip install -r requirements.txt

      - name: Verificar imports do projeto
        run: |
          python -c "from App import app; print('✅ App importado com sucesso')"

      - name: Gerar artefato ZIP
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $artifactPath = "artifacts/build-${{ github.run_number }}.zip"
          git archive --format=zip --output $artifactPath HEAD
          if ($LASTEXITCODE -ne 0) { throw "Failed to create ZIP artifact" }

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ github.run_number }}
          path: artifacts/build-${{ github.run_number }}.zip
          retention-days: 30

  lint:
    runs-on: windows_local
    needs: build

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências de linting
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Executar flake8 (sem tolerância a mascaramento de falhas)
        run: |
          flake8 . --count --show-source --statistics

  test:
    runs-on: windows_local
    needs: lint

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Executar testes automatizados
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Construir imagem Docker
        run: |
          docker build -t app:${{ github.sha }} .

      - name: Validar container com Docker Compose (Smoke Test em /health)
        run: |
          $ErrorActionPreference = "Stop"
          try {
            docker compose up -d
            if ($LASTEXITCODE -ne 0) { throw "Failed to start Docker Compose services" }

            $deadline = (Get-Date).AddSeconds(60)
            $response = $null
            while ((Get-Date) -lt $deadline) {
              try {
                $response = Invoke-WebRequest -Uri "http://localhost:5000/health" -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200) { break }
              }
              catch {
                Start-Sleep -Seconds 2
              }
            }

            if ($null -eq $response -or $response.StatusCode -ne 200) {
              docker compose logs
              throw "The app did not return HTTP 200 from /health"
            }
          }
          finally {
            docker compose down -v
            if ($LASTEXITCODE -ne 0) { Write-Warning "Failed to clean up Docker Compose services" }
          }

      - name: Salvar imagem Docker
        run: |
          docker save app:${{ github.sha }} -o image.tar

      - name: Upload da imagem Docker como artefato
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 7 


  deploy:
    runs-on: windows_local
    needs: test

    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download da imagem Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Carregar imagem Docker
        run: docker load -i image.tar

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag e push da imagem
        run: |
          $sourceImage = "app:${{ github.sha }}"
          $repository = "murilo751/achados-e-perdidos"
          $shaImage = "${repository}:${{ github.sha }}"
          $latestImage = "${repository}:latest"

          docker tag $sourceImage $shaImage
          if ($LASTEXITCODE -ne 0) { throw "Failed to create SHA tag" }
          docker tag $sourceImage $latestImage
          if ($LASTEXITCODE -ne 0) { throw "Failed to create latest tag" }

          docker push $shaImage
          if ($LASTEXITCODE -ne 0) { throw "Failed to push SHA tag" }
          docker push $latestImage
          if ($LASTEXITCODE -ne 0) { throw "Failed to push latest tag" }

          if ($env:GITHUB_REF -like "refs/tags/*") {
            $version = $env:GITHUB_REF.Substring("refs/tags/".Length)
            $versionImage = "${repository}:${version}"
            docker tag $sourceImage $versionImage
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release tag" }
            docker push $versionImage
            if ($LASTEXITCODE -ne 0) { throw "Failed to push release tag" }
          }
